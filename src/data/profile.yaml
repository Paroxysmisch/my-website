bioMarkdown: |
  I'm a PhD student in the Computer Architecture group at the University of Cambridge (2026–2030). My current work is on using agents to optimise GPU kernels.

  I did my BA (1st class) and MEng (Distinction) in Computer Science at Cambridge. My interests span computer architecture, geometric deep learning, reinforcement learning, NLP, graphics and computational biology.

  Before the PhD I deployed and managed large Slurm/Kubernetes GPU data-centres at Fluidstack, built high-performance data-processing pipelines at Ab Initio, and did research at Google DeepMind on positional encodings for Transformers.
