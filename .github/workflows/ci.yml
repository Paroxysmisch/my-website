name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run contrast   # WCAG contrast for every token pairing
      - run: bun run lint
      - run: bun run check
      - run: bun run build
      # a sub-path deploy (e.g. GitHub project pages) must not reference root-absolute assets, otherwise the
      # browser gets 404s for the module scripts and reports 'disallowed MIME type ("")'
      - run: SITE_BASE=/my-website bun run build
      - run: "! grep -E '(src|href)=\"/(_astro|favicon|posters)' dist/index.html"
