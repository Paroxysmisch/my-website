name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run contrast   # WCAG contrast for every token pairing
      - run: bun run lint
      - run: bun run check
      - run: bun run build
